name: release-check

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog for this release'
        required: true
        type: string

# Runs queue rather than overlap: each run numbers its candidate from the tags of the runs before it
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  E2E_TEST_USER_EMAIL: ${{ secrets.E2E_TEST_USER_EMAIL }}
  E2E_TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}
  MONITORING_SLACK_URL: ${{ secrets.MONITORING_SLACK_URL }}
  GOOGLE_SERVICES_DEV_JSON: ${{ secrets.GOOGLE_SERVICES_DEV_JSON }}
  GOOGLE_SERVICES_PROD_JSON: ${{ secrets.GOOGLE_SERVICES_PROD_JSON }}
  GOOGLE_DEPLOYMENT_KEY_DEV_JSON: ${{ secrets.GOOGLE_DEPLOYMENT_KEY_DEV_JSON }}
  GOOGLE_DEPLOYMENT_KEY_PROD_JSON: ${{ secrets.GOOGLE_DEPLOYMENT_KEY_PROD_JSON }}
  KEYSTORE_DEBUG_BASE64: ${{ secrets.KEYSTORE_DEBUG_BASE64 }}
  KEYSTORE_RELEASE_BASE64: ${{ secrets.KEYSTORE_RELEASE_BASE64 }}
  KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_RELEASE_PASSWORD }}
  KEYSTORE_RELEASE_ALIAS: ${{ secrets.KEYSTORE_RELEASE_ALIAS }}
  KEYSTORE_RELEASE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_RELEASE_ALIAS_PASSWORD }}

jobs:
  require-release-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Only allow master and hotfix branches
        if: github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/heads/hotfix-')
        run: |
          echo "::error::This workflow can only run on master or a hotfix-* branch (got ${{ github.ref_name }})"
          exit 1

  unit-test:
    needs: [require-release-branch]
    runs-on: ubuntu-24.04
    permissions:
      checks: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit-test
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test
        uses: ./.github/actions/unit-test
      - name: Slack report
        uses: slackapi/slack-github-action@v3
        if: always() # Ensure report is sent, even after errors
        with:
          payload: |
            {
              "text": "🚀 Release job <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.job }}> ${{ job.status }}"
            }
          webhook: ${{ env.MONITORING_SLACK_URL }}
          webhook-type: incoming-webhook

  build-android:
    needs: [require-release-branch]
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-android
      cancel-in-progress: true
    outputs:
      versionCode: ${{ steps.build_android.outputs.versionCode }}
      versionNameSuffix: ${{ steps.build_android.outputs.versionNameSuffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Do not remove. Needed to compute app version
      - name: Build Android
        id: build_android
        uses: ./.github/actions/build-android
        with:
          buildType: 'release'
          workflowType: 'release'
      - name: Slack report
        uses: slackapi/slack-github-action@v3
        if: always() # Ensure report is sent, even after errors
        with:
          payload: |
            {
              "text": "🚀 Release job <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.job }}> ${{ job.status }}"
            }
          webhook: ${{ env.MONITORING_SLACK_URL }}
          webhook-type: incoming-webhook

  deploy-android-release:
    needs: [build-android]
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-deploy-android-release
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: Android Build
      - name: Deploy
        shell: bash
        env:
          CHANGELOG: ${{ github.event.inputs.changelog }}
        run: |
          bundle exec fastlane android deploy_play_release \
            aab_path:android/app/build/outputs/bundle/release/app-release.aab \
            json_key_path:android/app/src/release/google-deployment-key.json \
            version_code:${{ needs.build-android.outputs.versionCode }} \
            changelog:"$CHANGELOG"
      - name: Slack report
        uses: slackapi/slack-github-action@v3
        if: always() # Ensure report is sent, even after errors
        with:
          payload: |
            {
              "text": "🚀 Release job <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.job }}> ${{ job.status }}"
            }
          webhook: ${{ env.MONITORING_SLACK_URL }}
          webhook-type: incoming-webhook

  tag-release:
    needs: [build-android, deploy-android-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Do not remove. Needed to find the previous tag for the release notes
      - name: Tag and create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/versioning/tag_release.sh "${{ github.repository }}" "${{ needs.build-android.outputs.versionCode }}" "$GITHUB_SHA"
      - name: Slack report
        uses: slackapi/slack-github-action@v3
        if: always() # Ensure report is sent, even after errors
        with:
          payload: |
            {
              "text": "🚀 Release job <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.job }}> ${{ job.status }}"
            }
          webhook: ${{ env.MONITORING_SLACK_URL }}
          webhook-type: incoming-webhook

  test-android:
    needs: [require-release-branch]
    runs-on: ubuntu-24.04
    # A test that hangs fails the job instead of running for GitHub\'s six hour default
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-android
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test Android
        uses: ./.github/actions/test-android
      - name: Slack report
        uses: slackapi/slack-github-action@v3
        if: always() # Ensure report is sent, even after errors
        with:
          payload: |
            {
              "text": "🚀 Release job <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.job }}> ${{ job.status }}"
            }
          webhook: ${{ env.MONITORING_SLACK_URL }}
          webhook-type: incoming-webhook
