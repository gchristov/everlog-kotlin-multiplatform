name: 'unit-test'
runs:
  using: "composite"
  steps:
    - name: Set up Gradle
      uses: ./.github/actions/setup-gradle
      with:
        ndk: 'false'
    - name: Test version codes
      shell: bash
      run: bash tools/versioning/version_code_test.sh
    - name: Test
      shell: bash
      run: |
        set -Eeuo pipefail 
        ./gradlew --no-daemon --continue testDebugUnitTest :gradle-plugins:conventions:test
    - name: Generate test report
      uses: mikepenz/action-junit-report@v6
      if: always() # Ensure all test reports are collected, even after errors
      with:
        report_paths: |
          **/TEST-*.xml
        check_name: unit-test-results
        include_passed: true
    - name: Artifacts
      uses: actions/upload-artifact@v7
      if: always() # Ensure all artifacts are collected, even after errors
      with:
        name: Tests
        path: |
          **/TEST-*.xml