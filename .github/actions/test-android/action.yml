name: 'test-android'
runs:
  using: "composite"
  steps:
    - name: Enable KVM group perms
      shell: bash
      run: |
        set -Eeuo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Set up Gradle
      uses: ./.github/actions/setup-gradle
    - name: Android tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 31
        arch: x86_64
        disk-size: 6G
        emulator-boot-timeout: 120
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        # On a failure, keep the device's log for the artifacts below
        script: ./gradlew connectedAndroidTest || (adb logcat -d > logcat.txt; exit 1)
    - name: Artifacts
      uses: actions/upload-artifact@v7
      if: always() # Ensure all artifacts are collected, even after errors
      with:
        name: Android Tests
        path: |
          **/test-result.pb
          **/build/outputs/androidTest-results/connected/**/*.xml
          logcat.txt