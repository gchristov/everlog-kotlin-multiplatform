name: 'test-android'
runs:
  using: "composite"
  steps:
    - name: Enable KVM group perms
      shell: bash
      run: |
        set -Eeuo pipefail
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Set up Gradle
      uses: ./.github/actions/setup-gradle
      with:
        ndk: 'false'
    - name: Start building the app and test APKs
      shell: bash
      # In the background, so the build overlaps the emulator's setup and boot; the tests wait for it below
      run: |
        nohup bash -c './gradlew :android:app:assembleDebug assembleDebugAndroidTest > build.log 2>&1; echo $? > build.status' > /dev/null 2>&1 &
    - name: Android tests
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        disk-size: 6G
        # Booting alongside the build takes longer than on its own
        emulator-boot-timeout: 300
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        # Each line runs on its own. The build started above has to finish, and pass, first. A heavy build can starve
        # the booting emulator until a system app stops responding, and its dialog then takes the window focus every
        # test needs, so close it and hide any later ones. On a test failure, keep the device's log for the artifacts
        # below.
        script: |
          while [ ! -f build.status ]; do sleep 5; done
          cat build.log
          test "$(cat build.status)" = 0
          adb shell settings put global hide_error_dialogs 1
          adb shell am broadcast -a android.intent.action.CLOSE_SYSTEM_DIALOGS
          ./gradlew connectedAndroidTest || (adb logcat -d > logcat.txt; exit 1)
    - name: Artifacts
      uses: actions/upload-artifact@v7
      if: always() # Ensure all artifacts are collected, even after errors
      with:
        name: Android Tests
        path: |
          **/test-result.pb
          **/build/outputs/androidTest-results/connected/**/*.xml
          logcat.txt
          build.log