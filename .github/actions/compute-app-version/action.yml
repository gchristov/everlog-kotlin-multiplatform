name: 'Compute app version'
inputs:
  workflowType:
    description: 'The workflow type (pr, master, nightly, release)'
    required: true
outputs:
  versionCode:
    description: 'Calculated version code'
    value: ${{ steps.compute.outputs.versionCode }}
  versionNameSuffix:
    description: 'Calculated version name suffix'
    value: ${{ steps.compute.outputs.versionNameSuffix }}
runs:
  using: "composite"
  steps:
    - id: compute
      shell: bash
      run: |
        set -Eeuo pipefail
        if [[ "${{ inputs.workflowType }}" == "pr" ]]; then
          ./tools/versioning/app_version.sh pr "${{ github.event.pull_request.number }}" \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/app_version.txt"
        else
          ./tools/versioning/app_version.sh "${{ inputs.workflowType }}" > "$RUNNER_TEMP/app_version.txt"
        fi
        cat "$RUNNER_TEMP/app_version.txt" >> $GITHUB_OUTPUT
        sed 's/^/### /; s/=/: /' "$RUNNER_TEMP/app_version.txt" >> $GITHUB_STEP_SUMMARY
