name: 'Compute app version'
inputs:
  workflowType:
    description: 'The workflow type (pr, master, nightly, release)'
    required: true
outputs:
  versionCode:
    description: 'Calculated version code'
    value: ${{ steps.compute.outputs.versionCode }}
  versionNameSuffix:
    description: 'Calculated version name suffix'
    value: ${{ steps.compute.outputs.versionNameSuffix }}
runs:
  using: "composite"
  steps:
    - id: compute
      shell: bash
      run: |
        set -Eeuo pipefail
        TYPE="${{ inputs.workflowType }}"

        if [[ "$TYPE" == "pr" ]]; then
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          VERSION_SUFFIX="pr-${{ github.event.pull_request.number }}-${HEAD_SHA:0:7}"
          VERSION_CODE=$(./tools/versioning/version_code.sh pr "${{ github.event.pull_request.base.sha }}" "$HEAD_SHA")
        elif [[ "$TYPE" == "nightly" ]]; then
          VERSION_SUFFIX="nightly-$(date -u +'%d%m%Y')"
          VERSION_CODE=$(./tools/versioning/version_code.sh nightly)
        elif [[ "$TYPE" == "release" ]]; then
          VERSION_SUFFIX="none"
          VERSION_CODE=$(./tools/versioning/version_code.sh release)
        else
          VERSION_SUFFIX="$TYPE"
          VERSION_CODE=$(./tools/versioning/version_code.sh "$TYPE")
        fi

        echo "versionCode=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "versionNameSuffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT

        echo "### Version Code: $VERSION_CODE" >> $GITHUB_STEP_SUMMARY
        echo "### Version Name Suffix: $VERSION_SUFFIX" >> $GITHUB_STEP_SUMMARY
