<!-- @dsCard group="Type" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: var(--space-lg); }
  .row { display: flex; align-items: baseline; gap: var(--space-lg); padding: var(--space-sm) 0; border-bottom: 1px solid var(--background-separator); }
  .row code { font: var(--font-small); color: var(--content-secondary); width: 130px; flex: none; }
</style></head><body>
<div class="row"><code>--font-title</code><span style="font: var(--font-title)">Push day</span></div>
<div class="row"><code>--font-heading</code><span style="font: var(--font-heading)">Bench press</span></div>
<div class="row"><code>--font-subtitle</code><span style="font: var(--font-subtitle); color: var(--content-secondary)">General</span></div>
<div class="row"><code>--font-body</code><span style="font: var(--font-body)">Rest timer</span></div>
<div class="row"><code>--font-body-bold</code><span style="font: var(--font-body-bold)">3 × 8 · 80 kg</span></div>
<div class="row"><code>--font-caption</code><span style="font: var(--font-caption); color: var(--content-secondary)">90 seconds</span></div>
<div class="row"><code>--font-small</code><span style="font: var(--font-small); color: var(--content-secondary)">Version 2.17.0</span></div>
<div class="row"><code>--font-button</code><span style="font: var(--font-button); color: var(--content-action)">Start workout</span></div>
</body></html>
