<!-- @dsCard group="Elements" -->
<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  .screen { position: relative; width: 412px; min-height: 760px; margin: 0 auto; background: var(--background-primary); padding-bottom: 150px; }
  .bar { height: 64px; display: flex; align-items: center; padding: 0 var(--space-lg); font: var(--font-heading); }
  .header { padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-sm); }
  .eyebrow { font: var(--font-caption); color: var(--content-action); }
  .title { font: var(--font-title); }
  .body { font: var(--font-body); color: var(--content-secondary); }
  .list { padding: var(--space-lg); display: flex; flex-direction: column; gap: var(--space-lg); }
  .section { font: var(--font-subtitle); color: var(--content-secondary); margin-bottom: var(--space-lg); }
  .group { background: var(--background-surface); border-radius: var(--radius-surface); overflow: hidden; }
  .row { display: flex; align-items: center; gap: var(--space-lg); padding: var(--space-lg); min-height: var(--list-row-min-height); }
  .row + .row { border-top: 1px solid var(--background-separator); }
  .text { flex: 1; display: flex; flex-direction: column; gap: var(--space-xs); }
  .sub { font: var(--font-caption); color: var(--content-secondary); }
  .trail { font: var(--font-body); color: var(--content-secondary); }
  .note { font: var(--font-caption); color: var(--content-secondary); margin-top: var(--space-sm); }
  .footer { position: absolute; left: var(--space-lg); right: var(--space-lg); bottom: var(--space-sm); padding: var(--space-lg);
    border-radius: var(--radius-surface); border: 1px solid var(--background-separator);
    background: var(--background-blur-overlay); backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: var(--space-sm); }
  .btn { min-height: var(--button-min-height); padding: var(--space-sm) var(--space-xl); border-radius: var(--radius-button);
    font: var(--font-button); border: 0; width: 100%; }
  .primary { background: var(--content-action); color: var(--content-on-action); }
  .tertiary { background: none; color: var(--content-action); }
</style></head><body>
<div class="screen"><!-- AppScreen -->
  <div class="bar">←</div><!-- AppBar -->
  <div class="header"><!-- AppBarHeader -->
    <div class="eyebrow">Your routine</div>
    <div class="title">Push day</div>
    <div class="body">Chest, shoulders and triceps, about 45 minutes.</div>
  </div>
  <div class="list"><!-- AppGroupedList -->
    <div><!-- AppListGroup -->
      <div class="section">Exercises</div><!-- AppSectionHeader -->
      <div class="group">
        <div class="row"><div class="text"><div>Bench press</div><div class="sub">3 sets · 8 reps</div></div><div class="trail">80 kg</div></div>
        <div class="row"><div class="text"><div>Overhead press</div><div class="sub">3 sets · 10 reps</div></div><div class="trail">40 kg</div></div>
        <div class="row"><div class="text"><div>Triceps pushdown</div><div class="sub">3 sets · 12 reps</div></div><div class="trail">25 kg</div></div>
      </div>
      <div class="note">Weights are suggested from your last workout.</div>
    </div>
    <div><!-- AppListGroup -->
      <div class="section">Settings</div>
      <div class="group">
        <div class="row"><div class="text"><div>Rest timer</div></div><div class="trail">90 s</div></div>
      </div>
    </div>
  </div>
  <div class="footer"><!-- AppFooter -->
    <button class="btn tertiary">Edit routine</button><!-- AppTertiaryButton -->
    <button class="btn primary">Start workout</button><!-- AppButton -->
  </div>
</div>
</body></html>
